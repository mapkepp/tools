<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Mapkepp Voice Lab</title><style>body{font:16px system-ui;background:#10182a;color:white;max-width:760px;margin:auto;padding:22px}textarea,input{width:100%;background:#20304b;color:white;padding:12px;box-sizing:border-box}button{padding:12px;margin:8px 4px 8px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#263750;padding:15px}small{color:#c4d4ec}</style><h1>Mapkepp · Voice Lab</h1><p>Изолированный эксперимент. Главная страница не изменяется. Никакие запросы не отправляются.</p><p>Демо-каталог устройств, без токенов:</p><textarea id="devices" rows="5">[{"id":"lamp-demo","name":"свет в спальне","capabilities":["on_off","range"]},{"id":"gate-demo","name":"ворота","capabilities":["on_off"],"sensitive":true}]</textarea><p>Голосовая фраза:</p><input id="phrase" value="Поставь свет в спальне на 40 процентов"><button id="go">Разобрать</button><button id="mic">🎙 Диктовать</button><p id="status" role="status"></p><pre id="out"></pre><small>Только локальный разбор и предварительный план: действия НЕ выполняются. Не вводите токены и cookies.</small><script>
const el=id=>document.getElementById(id), norm=s=>String(s).toLowerCase().replace(/ё/g,"е").replace(/[^а-яa-z0-9% ]/g," ").replace(/ +/g," ").trim();
function interpret(s,devices){s=norm(s);if(!s)return {status:"error",reason:"Пустая фраза"};const found=devices.filter(d=>d&&d.name&&s.includes(norm(d.name)));if(found.length!==1)return {status:"clarify",reason:"Не удалось однозначно выбрать устройство"};const d=found[0];if(!d.id||!Array.isArray(d.capabilities))return {status:"error",reason:"Неверное описание устройства"};
const words={ноль:0,десять:10,двадцать:20,тридцать:30,сорок:40,пятьдесят:50,шестьдесят:60,семьдесят:70,восемьдесят:80,девяносто:90,сто:100};
const pct=s.match(/(\d{1,3})\s*(%|процент)/);const w=Object.keys(words).find(k=>s.includes(k+" процент"));const val=pct?Number(pct[1]):w?words[w]:null;
const on=/\b(включи|зажги|открой)\b/.test(s),off=/\b(выключи|выруби|погаси|отключи|закрой)\b/.test(s);
if(on&&off)return {status:"clarify",reason:"Противоречивое действие"};
if(val===null&&!on&&!off&&/(статус|состояние|работает|включен|включена|проверь)/.test(s))return {status:"read",method:"GET",path:"/v1.0/devices/"+encodeURIComponent(d.id),requires:"iot:view",executed:false};
const action=val!==null?{type:"range",instance:"brightness",value:val}:on||off?{type:"on_off",instance:"on",value:on}:null;
if(!action)return {status:"clarify",reason:"Не удалось определить действие"};if(val!==null&&(val<0||val>100))return {status:"error",reason:"Допустимы 0–100 процентов"};if(!d.capabilities.includes(action.type))return {status:"unsupported",reason:"Устройство не поддерживает действие"};
if(d.sensitive||/(ворот|замок|двер|котел|обогрев)/.test(norm(d.name)))return {status:"confirmation_required",reason:"Требуется отдельное подтверждение",device:d.name,action,executed:false};
return {status:"preview",method:"POST",path:"/v1.0/devices/actions",requires:"iot:control",device_id:d.id,action,executed:false};}
el("go").onclick=()=>{try{let ds=JSON.parse(el("devices").value);if(!Array.isArray(ds)||ds.length>200)throw Error("Каталог должен быть массивом до 200 устройств");let x=interpret(el("phrase").value,ds);el("status").textContent=x.status;el("out").textContent=JSON.stringify(x,null,2)}catch(e){el("status").textContent="Ошибка";el("out").textContent=e.message}};
el("mic").onclick=()=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){el("status").textContent="Диктовка браузером не поддерживается";return}const r=new R();r.lang="ru-RU";r.onresult=e=>{el("phrase").value=e.results[0][0].transcript;el("go").click()};r.onerror=e=>el("status").textContent=e.error;r.start()};el("go").click();
</script>
