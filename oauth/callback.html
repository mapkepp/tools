<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Яндекс ID — Mapkepp Tools</title>
<style>body{font:16px/1.5 system-ui,-apple-system,Arial,sans-serif;background:#0d1527;color:#f5f8ff;margin:0;padding:24px}main{max-width:620px;margin:7vh auto;background:#1b2840;padding:26px;border:1px solid #405272;border-radius:17px}h1{font-size:1.6rem}p{color:#c4d3e7}button,a{font:inherit;color:#101c25;padding:13px 18px;background:#8ee6bb;border:0;border-radius:10px;font-weight:700;display:inline-block;cursor:pointer;text-decoration:none;margin:8px 5px 8px 0}button:disabled{opacity:.45}a{color:#d0e7ff;background:#2b3b5b}.note{padding:14px;border:1px solid #4b627f;background:#20344e;border-radius:10px}.msg{font-size:.9rem;margin-top:16px}</style>
</head><body><main><h1>🔐 Разрешение Яндекса</h1><p id="result">Проверяю ответ Яндекс ID…</p><div id="actions" hidden><button id="copy">Скопировать токен для iPhone</button><a href="../studio/">Вернуться в конструктор</a></div><p class="note">Ваш токен доступен только в этой открытой вкладке. Мы не сохраняем его в файлах, cookie и на сервере. После копирования закройте вкладку и вставьте токен в команду-помощник iPhone.</p><p class="msg" id="info"></p></main>
<script>
(()=>{
"use strict";
const hash=new URLSearchParams(location.hash.replace(/^#/,""));
const query=new URLSearchParams(location.search);
let token=hash.get("access_token")||"";
history.replaceState(null,"",location.pathname);
const $=id=>document.getElementById(id);
if(token&&token.length>12){
 $("result").textContent="Доступ разрешён. Нажмите «Скопировать токен» — он понадобится только для команды на iPhone.";
 $("actions").hidden=false;
 $("copy").addEventListener("click",async()=>{
   try{await navigator.clipboard.writeText(token);$("info").textContent="Токен скопирован. Откройте «Команды» и вставьте его при добавлении помощника.";}
   catch(e){$("info").textContent="Не удалось скопировать автоматически. Используйте Safari и разрешите доступ к буферу обмена.";}
 });
}else if(query.get("error")||hash.get("error")){
 $("result").textContent="Яндекс отказал в доступе: "+(query.get("error")||hash.get("error"));
 $("info").textContent="Проверьте права iot:view и iot:control в OAuth-приложении и повторите авторизацию.";
}else if(query.get("code")){
 $("result").textContent="Яндекс вернул код подтверждения, а не токен. Для автоматического обмена кода потребуется защищённый обработчик авторизации. Токен здесь не сохранялся.";
}else $("result").textContent="Параметры авторизации отсутствуют. Откройте страницу через официальную кнопку «Получить разрешение у Яндекса» на сайте Mapkepp Tools.";
window.addEventListener("pagehide",()=>{token="";});
})();
</script></body></html>
