name: Publish Mapkepp Tools to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'services.html'
      - 'assets/**'
      - 'studio/**'
      - 'ios/**'
      - 'oauth/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and package static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout primary source repository
        uses: actions/checkout@v4
      - name: Verify primary website and Pages activation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -s index.html
          grep -q 'Mapkepp Tools' index.html
          echo "Source: https://github.com/${GH_REPOSITORY}"
          status=$(curl -L -sS -o /tmp/pages-api.json -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GH_REPOSITORY}/pages")
          if [[ "${status}" != "200" ]]; then
            echo "::error::GitHub Pages is not enabled (Pages API HTTP ${status})."
            echo "::error::One-time setup: https://github.com/${GH_REPOSITORY}/settings/pages -> Source: GitHub Actions."
            echo "::error::After activation, push to main or use Run workflow. Future changes auto-deploy."
            exit 1
          fi
          echo "GitHub Pages is enabled: HTTP 200"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Package only public website files
        shell: bash
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp services.html _site/services.html
          touch _site/.nojekyll
          if [[ -d assets ]]; then cp -R assets _site/assets; fi
          if [[ -d studio ]]; then cp -R studio _site/studio; fi
          if [[ -d ios ]]; then cp -R ios _site/ios; fi
          if [[ -d oauth ]]; then cp -R oauth _site/oauth; fi
      - name: Include verified historic Apple Shortcut artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/examples
          old_commit="efce885304d1b8b83d4f217a8440c8a80be59295"
          source="https://raw.githubusercontent.com/mapkepp/loto-generator/${old_commit}/ios-shortcuts/yandex-smart-home"
          curl --fail --location --silent --show-error --retry 2 --max-time 30 "${source}/Kitchen_Light_ON.shortcut" -o _site/examples/Kitchen_Light_ON.shortcut
          curl --fail --location --silent --show-error --retry 2 --max-time 30 "${source}/Kitchen_Light_OFF.shortcut" -o _site/examples/Kitchen_Light_OFF.shortcut
          echo 'c91fe62140d74e70983d34381cf8b79348a1852b3fa585aaf0c213ed25b65355  _site/examples/Kitchen_Light_ON.shortcut' | sha256sum --check
          echo '13988b58a64d296b45bc84fa4a634fdf20ae26c96a030eee525ce22462d0a5f1  _site/examples/Kitchen_Light_OFF.shortcut' | sha256sum --check
          python3 - <<'PY'
          from pathlib import Path
          for name in ('ON','OFF'):
              path=Path('_site/examples/Kitchen_Light_'+name+'.shortcut')
              payload=path.read_bytes()
              assert payload[:4] == b'AEA1', f'{name}: signed Apple AEA1 header missing'
              assert 1000 < len(payload) < 100000, f'{name}: unexpected artifact size'
              print(name, 'verified AEA1:', len(payload), 'bytes; synthetic identifiers, no live device claim')
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    name: Publish site
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
