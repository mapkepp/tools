name: Check smart-home security and functionality

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'studio/**'
      - 'oauth/**'
      - 'tests/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'api/**'
      - 'studio/**'
      - 'oauth/**'
      - 'tests/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test proxy privacy, CORS and iPhone UI prerequisites
        run: node --test tests/*.test.mjs
